<!doctype html>
<!-- The source of app/macos/icon-1024.png. Rendered, not hand-drawn:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
         --user-data-dir=<throwaway> --force-device-scale-factor=1 --window-size=1024,1024 \
         --default-background-color=00000000 --screenshot=app/macos/icon-1024.png app/macos/icon.html

     Nothing here is invented: the mark is BioQL's own — three orbits around a benzene hexagon — read off
     `Spectrix_BioQL/docs/BIOQL Documentos por revisa/molevera_bioql_logo.png`, and the colours are the exact
     values sampled out of that file: #2DD4BF (the turquoise of "BioQL"), #26B5A3, #22D3EE, #F2F7FC on #060A0F.

     The 824-of-1024 square with its 185 px radius is the macOS icon grid: an app icon does not fill its canvas.
     `border-radius` is a circular approximation of Apple's continuous-curvature squircle — close at this size,
     and not the same curve. -->
<html lang="en">
<meta charset="utf-8">
<title>BioQL Studio icon</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .tile {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
    border-radius: 185px; overflow: hidden;
    background:
      radial-gradient(circle at 50% 44%, #0E3137 0%, #09212A 38%, #060A0F 78%),
      #060A0F;
    box-shadow: inset 0 2px 0 rgba(242, 247, 252, .10), inset 0 -40px 90px rgba(0, 0, 0, .55);
  }
  svg { position: absolute; left: 0; top: 0; }
</style>
<div class="tile">
  <svg width="824" height="824" viewBox="0 0 824 824" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="halo" cx="50%" cy="46%" r="50%">
        <stop offset="0%" stop-color="#2DD4BF" stop-opacity=".22"/>
        <stop offset="60%" stop-color="#2DD4BF" stop-opacity=".05"/>
        <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#22D3EE"/>
        <stop offset="55%" stop-color="#2DD4BF"/>
        <stop offset="100%" stop-color="#26B5A3"/>
      </linearGradient>
    </defs>

    <circle cx="412" cy="392" r="372" fill="url(#halo)"/>

    <!-- the three orbits -->
    <g stroke="url(#orbit)" stroke-width="13" fill="none" stroke-linecap="round">
      <ellipse cx="412" cy="392" rx="300" ry="136"/>
      <ellipse cx="412" cy="392" rx="300" ry="136" transform="rotate(60 412 392)"/>
      <ellipse cx="412" cy="392" rx="300" ry="136" transform="rotate(120 412 392)"/>
    </g>

    <!-- the benzene ring at the centre -->
    <g transform="translate(412 392)">
      <polygon points="0,-132 114,-66 114,66 0,132 -114,66 -114,-66"
               fill="#060A0F" stroke="#F2F7FC" stroke-width="12" stroke-linejoin="round"/>
      <circle r="52" fill="none" stroke="#26B5A3" stroke-width="13"/>
      <circle r="27" fill="#F2F7FC"/>
      <!-- the six vertices -->
      <g fill="#2DD4BF">
        <circle cx="0" cy="-132" r="16"/><circle cx="114" cy="-66" r="16"/><circle cx="114" cy="66" r="16"/>
        <circle cx="0" cy="132" r="16"/><circle cx="-114" cy="66" r="16"/><circle cx="-114" cy="-66" r="16"/>
      </g>
    </g>

    <!-- the electrons, on the orbits -->
    <circle cx="112" cy="392" r="26" fill="#22D3EE"/>
    <circle cx="712" cy="392" r="26" fill="#22D3EE"/>
    <circle cx="262" cy="652" r="26" fill="#2DD4BF"/>
    <circle cx="562" cy="132" r="26" fill="#2DD4BF"/>
  </svg>
</div>
</html>
